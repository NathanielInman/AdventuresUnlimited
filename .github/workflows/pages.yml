name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; let a running deploy finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so VitePress can show each page's last-updated date
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Both the calculators (Vite 4) and VitePress (Vite 5) build on 26
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            utilities/package-lock.json

      - name: Build the calculators
        working-directory: utilities
        env:
          TOOLS_BASE: /AdventuresUnlimited/tools/
        run: |
          npm ci
          npm run build

      - name: Build the docs
        run: |
          npm ci
          npm run docs:build

      - name: Put the calculators under tools/
        run: cp -r utilities/dist docs/.vitepress/dist/tools

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
