<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070c16"/>
      <stop offset=".6" stop-color="#14203a"/>
      <stop offset="1" stop-color="#273549"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3fb1f2" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#3fb1f2" stop-opacity=".14"/>
      <stop offset="1" stop-color="#3fb1f2" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <circle cx="42" cy="20" r="8.5" fill="#fff"/>
      <circle cx="46.5" cy="16.5" r="7.5" fill="#000"/>
    </mask>
    <clipPath id="disc"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <style>
    .tw { animation: tw 4s ease-in-out infinite; }
    .tw2 { animation-delay: 1.4s; animation-duration: 5.2s; }
    .tw3 { animation-delay: 2.6s; animation-duration: 3.6s; }
    @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { .tw { animation: none; } }
  </style>
  <circle cx="32" cy="32" r="30" fill="url(#sky)"/>
  <g clip-path="url(#disc)">
    <circle cx="42" cy="20" r="20" fill="url(#glow)"/>
    <circle cx="42" cy="20" r="8.5" fill="#e9f6ff" mask="url(#crescent)"/>
    <g fill="#cfe9fb">
      <circle class="tw" cx="15" cy="20" r="1.2"/>
      <circle class="tw tw2" cx="24" cy="12" r=".9"/>
      <circle class="tw tw3" cx="54" cy="34" r="1"/>
      <circle cx="20" cy="30" r=".6" opacity=".7"/>
      <circle cx="33" cy="17" r=".5" opacity=".6"/>
    </g>
    <path d="M0,46 L9,39 L14,42 L26,25 L33,35 L39,30 L50,43 L57,39 L64,43 V64 H0 Z" fill="#203453"/>
    <path d="M0,46 L9,39 L14,42 L26,25 L33,35 L39,30 L50,43 L57,39 L64,43" fill="none" stroke="#3fb1f2" stroke-width="1.4" stroke-linejoin="round" stroke-opacity=".85"/>
    <path d="M26,25 L22.2,30.4 L24.6,29.6 L26.2,31.6 L28,29.4 L30.2,30.4 Z" fill="#e9f6ff" opacity=".9"/>
    <path d="M0,53 Q16,46 32,51 T64,49 V64 H0 Z" fill="#0b1324"/>
    <circle cx="44" cy="52.5" r="1.3" fill="#f2b33f"/>
    <circle cx="44" cy="52.5" r="3.2" fill="#f2b33f" opacity=".22"/>
  </g>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#3fb1f2" stroke-opacity=".55" stroke-width="1.5"/>
